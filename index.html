<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitLens — GitHub Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">Git<span>Lens</span></div>
    <div style="font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--muted);">GitHub Explorer</div>
  </header>

  <main>
    <section class="hero">
      <h1>Explore GitHub Profiles</h1>
      <p>// search any username → dive into their repos</p>
      <div id="lastSearched" class="last-searched" onclick="restoreLastSearch()">
        🕐 Last: <span id="lastSearchedName"></span>
      </div>
      <div class="search-wrap">
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Enter GitHub username..."
          autocomplete="off"
          onkeydown="handleKey(event)"
        />
        <button id="searchBtn" class="search-btn" onclick="search()">Search</button>
      </div>
    </section>

    <div id="output"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModalOutside(event)">
    <div class="modal" id="modalContent">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
