<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitLens — GitHub Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & Variables ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #f87171;
    --star: #fbbf24;
    --radius: 12px;
    --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background Mesh ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 20%, rgba(110,231,183,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 90% 80%, rgba(129,140,248,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent2); }

  /* ── Main Layout ── */
  main {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  /* ── Hero Search ── */
  .hero {
    text-align: center;
    margin-bottom: 3.5rem;
    animation: fadeUp 0.6s ease both;
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 0.75rem;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
    font-family: 'Space Mono', monospace;
  }

  /* ── Search Bar ── */
  .search-wrap {
    display: flex;
    gap: 0.75rem;
    max-width: 560px;
    margin: 0 auto;
  }

  .search-input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,231,183,0.12);
  }
  .search-input::placeholder { color: var(--muted); }

  .search-btn {
    padding: 0.85rem 1.6rem;
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    border-radius: var(--radius);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity var(--transition), transform var(--transition);
    white-space: nowrap;
  }
  .search-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
  .search-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* ── Filter Bar ── */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.4s ease both;
  }

  .filter-input {
    flex: 1; min-width: 160px;
    padding: 0.55rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .filter-input:focus { border-color: var(--accent2); }
  .filter-input::placeholder { color: var(--muted); }

  .sort-select {
    padding: 0.55rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }

  /* ── Spinner ── */
  .spinner-wrap {
    display: flex; align-items: center; justify-content: center;
    gap: 0.75rem; padding: 4rem 0;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ── Error / Empty ── */
  .message-box {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    animation: fadeUp 0.4s ease both;
  }
  .message-box .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .message-box h3 { font-size: 1.2rem; margin-bottom: 0.4rem; }
  .message-box p { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.85rem; }
  .message-box.error { border-color: rgba(248,113,113,0.3); }
  .message-box.error h3 { color: var(--danger); }

  /* ── Profile Card ── */
  .profile-card {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.5rem 2rem;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .profile-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 3px solid var(--border);
    object-fit: cover;
    transition: border-color var(--transition);
  }
  .avatar:hover { border-color: var(--accent); }

  .profile-info { min-width: 0; }
  .profile-name {
    font-size: 1.6rem; font-weight: 800;
    margin-bottom: 0.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-login {
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }
  .profile-bio {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1rem;
    line-height: 1.5;
  }

  .profile-stats {
    display: flex; flex-wrap: wrap; gap: 1rem;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 1.1rem;
    min-width: 80px;
  }
  .stat-value {
    font-size: 1.3rem; font-weight: 800;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
  }
  .stat-label {
    font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-top: 0.2rem;
  }

  .profile-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    margin-top: 1rem;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    text-decoration: none;
    transition: opacity var(--transition);
  }
  .profile-link:hover { opacity: 0.7; }

  /* ── Section heading ── */
  .section-title {
    font-size: 1.1rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 1.2rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .section-title::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  /* ── Repo Grid ── */
  .repos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  /* ── Repo Card ── */
  .repo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    cursor: pointer;
    transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    display: flex; flex-direction: column; gap: 0.6rem;
    animation: fadeUp 0.4s ease both;
    position: relative;
    overflow: hidden;
  }
  .repo-card:hover {
    border-color: var(--accent2);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(129,140,248,0.12);
  }

  .repo-name {
    font-weight: 700; font-size: 1rem;
    color: var(--accent2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .repo-desc {
    font-size: 0.82rem; color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.5em;
  }
  .repo-meta {
    display: flex; flex-wrap: wrap; gap: 0.8rem;
    margin-top: auto;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .meta-item {
    display: flex; align-items: center; gap: 0.3rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem; color: var(--muted);
  }
  .meta-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .meta-item.stars { color: var(--star); }
  .meta-item.forks { color: var(--accent2); }

  /* ── Pagination ── */
  .pagination {
    display: flex; justify-content: center; align-items: center; gap: 0.5rem;
    margin-top: 2.5rem;
    flex-wrap: wrap;
  }
  .page-btn {
    padding: 0.5rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all var(--transition);
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .page-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 700; }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    animation: fadeIn 0.2s ease both;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 2rem;
    max-width: 550px; width: 100%;
    position: relative;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    max-height: 90vh; overflow-y: auto;
  }
  .modal::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 18px 18px 0 0;
  }
  .modal-close {
    position: absolute; top: 1rem; right: 1rem;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 50%;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1rem;
    transition: all var(--transition);
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }

  .modal h2 {
    font-size: 1.4rem; font-weight: 800;
    color: var(--accent2);
    margin-bottom: 0.5rem;
    padding-right: 2rem;
  }
  .modal-desc { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.25rem; }
  .modal-stats {
    display: flex; flex-wrap: wrap; gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .modal-stat {
    display: flex; align-items: center; gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.85rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
  }
  .modal-link {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent);
    color: #0a0a0f;
    padding: 0.65rem 1.3rem;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    transition: opacity var(--transition);
  }
  .modal-link:hover { opacity: 0.8; }

  /* ── Contribution graph mock ── */
  .contrib-section { margin-top: 1.5rem; }
  .contrib-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 0.75rem;
  }
  .contrib-grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    gap: 2px;
    width: 100%;
  }
  .contrib-cell {
    aspect-ratio: 1;
    border-radius: 2px;
    background: var(--surface2);
    transition: background 0.15s;
  }
  .contrib-cell:hover { outline: 1px solid var(--accent); }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: scale(0.93) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 0.9rem 1.2rem; }
    main { padding: 2rem 1rem 4rem; }
    .profile-card { grid-template-columns: 1fr; text-align: center; }
    .profile-stats { justify-content: center; }
    .repos-grid { grid-template-columns: 1fr; }
    .search-wrap { flex-direction: column; }
    .contrib-grid { grid-template-columns: repeat(26, 1fr); }
  }

  /* ── Last searched badge ── */
  .last-searched {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.3rem 0.9rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 1rem;
    cursor: pointer;
    transition: border-color var(--transition);
  }
  .last-searched:hover { border-color: var(--accent2); }
  .last-searched span { color: var(--accent2); }

  /* hide by default */
  #lastSearched { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">Git<span>Lens</span></div>
  <div style="font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--muted);">GitHub Explorer</div>
</header>

<main>
  <!-- Hero -->
  <section class="hero">
    <h1>Explore GitHub Profiles</h1>
    <p>// search any username → dive into their repos</p>

    <div id="lastSearched" class="last-searched" onclick="restoreLastSearch()">
      🕐 Last: <span id="lastSearchedName"></span>
    </div>

    <div class="search-wrap">
      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="Enter GitHub username..."
        autocomplete="off"
        onkeydown="handleKey(event)"
      />
      <button id="searchBtn" class="search-btn" onclick="search()">Search</button>
    </div>
  </section>

  <!-- Output area -->
  <div id="output"></div>
</main>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModalOutside(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ── State ──
let allRepos = [];
let filteredRepos = [];
let currentPage = 1;
const PER_PAGE = 12;

// ── GitHub API ──
const API = username => `https://api.github.com/users/${username}`;
const REPOS_API = username => `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`;

// ── LocalStorage: last search ──
function saveLastSearch(username) {
  localStorage.setItem('gh_last_user', username);
  showLastSearched(username);
}
function loadLastSearch() {
  const u = localStorage.getItem('gh_last_user');
  if (u) showLastSearched(u);
}
function showLastSearched(u) {
  const el = document.getElementById('lastSearched');
  document.getElementById('lastSearchedName').textContent = u;
  el.style.display = 'inline-flex';
}
function restoreLastSearch() {
  const u = localStorage.getItem('gh_last_user');
  if (u) { document.getElementById('searchInput').value = u; search(); }
}

// ── Search Entry ──
function handleKey(e) { if (e.key === 'Enter') search(); }

async function search() {
  const username = document.getElementById('searchInput').value.trim();
  if (!username) return;

  setSearching(true);
  showSpinner('Fetching profile...');

  try {
    const [userRes, reposRes] = await Promise.all([
      fetch(API(username)),
      fetch(REPOS_API(username))
    ]);

    if (userRes.status === 404) { showError('User not found', `"${username}" does not exist on GitHub.`); return; }
    if (!userRes.ok) throw new Error(`GitHub API error: ${userRes.status}`);

    const user = await userRes.json();
    const repos = reposRes.ok ? await reposRes.json() : [];

    saveLastSearch(username);
    allRepos = repos;
    applyFilters();
    renderProfile(user, repos.length);

  } catch (err) {
    showError('Network Error', 'Could not connect to GitHub. Check your connection and try again.');
    console.error(err);
  } finally {
    setSearching(false);
  }
}

function setSearching(on) {
  document.getElementById('searchBtn').disabled = on;
}

// ── Render ──
function showSpinner(msg) {
  document.getElementById('output').innerHTML = `
    <div class="spinner-wrap">
      <div class="spinner"></div> ${msg}
    </div>`;
}

function showError(title, msg) {
  document.getElementById('output').innerHTML = `
    <div class="message-box error">
      <div class="icon">⚠️</div>
      <h3>${title}</h3>
      <p>${msg}</p>
    </div>`;
}

function renderProfile(user, repoCount) {
  const out = document.getElementById('output');

  // ── Profile Section ──
  const avatarEl = user.avatar_url
    ? `<img class="avatar" src="${user.avatar_url}" alt="${user.login}" loading="lazy" />`
    : `<div class="avatar" style="background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2rem;">👤</div>`;

  out.innerHTML = `
    <div class="profile-card">
      ${avatarEl}
      <div class="profile-info">
        <div class="profile-name">${user.name || user.login}</div>
        <div class="profile-login">@${user.login}</div>
        ${user.bio ? `<div class="profile-bio">${user.bio}</div>` : ''}
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-value">${fmt(user.followers)}</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat">
            <span class="stat-value">${fmt(user.following)}</span>
            <span class="stat-label">Following</span>
          </div>
          <div class="stat">
            <span class="stat-value">${fmt(user.public_repos)}</span>
            <span class="stat-label">Repos</span>
          </div>
          ${user.public_gists ? `<div class="stat">
            <span class="stat-value">${fmt(user.public_gists)}</span>
            <span class="stat-label">Gists</span>
          </div>` : ''}
        </div>
        <a class="profile-link" href="${user.html_url}" target="_blank" rel="noopener">
          ↗ View on GitHub
        </a>
      </div>
    </div>

    <!-- Contribution graph -->
    <div class="contrib-section" style="margin-bottom:2rem;">
      <div class="contrib-title">Contribution Activity (mock visualization)</div>
      <div class="contrib-grid" id="contribGrid"></div>
    </div>

    <!-- Filter / Sort bar -->
    <div class="filter-bar">
      <input class="filter-input" id="filterInput" type="text" placeholder="🔍 Filter repositories..."
        oninput="applyFilters()" />
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="updated">Sort: Recent</option>
        <option value="stars">Sort: Stars ↓</option>
        <option value="forks">Sort: Forks ↓</option>
        <option value="name">Sort: Name A-Z</option>
      </select>
    </div>

    <div class="section-title">Repositories</div>
    <div id="reposContainer"></div>
    <div id="paginationContainer"></div>
  `;

  renderContribGraph();
  applyFilters();
}

function renderContribGraph() {
  const grid = document.getElementById('contribGrid');
  if (!grid) return;
  const colors = ['var(--surface2)', '#064e3b','#065f46','#047857','#059669','#10b981','#34d399','#6ee7b7'];
  const cells = 52 * 7;
  let html = '';
  for (let i = 0; i < cells; i++) {
    const w = Math.random();
    const c = w < 0.55 ? colors[0]
            : w < 0.70 ? colors[1]
            : w < 0.80 ? colors[2]
            : w < 0.87 ? colors[3]
            : w < 0.92 ? colors[4]
            : w < 0.96 ? colors[5]
            : w < 0.98 ? colors[6]
            : colors[7];
    html += `<div class="contrib-cell" style="background:${c};" title="contributions"></div>`;
  }
  grid.innerHTML = html;
}

// ── Filter + Sort + Paginate ──
function applyFilters() {
  const q = (document.getElementById('filterInput')?.value || '').toLowerCase();
  const sort = document.getElementById('sortSelect')?.value || 'updated';

  filteredRepos = allRepos.filter(r =>
    r.name.toLowerCase().includes(q) ||
    (r.description || '').toLowerCase().includes(q) ||
    (r.language || '').toLowerCase().includes(q)
  );

  if (sort === 'stars') filteredRepos.sort((a,b) => b.stargazers_count - a.stargazers_count);
  else if (sort === 'forks') filteredRepos.sort((a,b) => b.forks_count - a.forks_count);
  else if (sort === 'name') filteredRepos.sort((a,b) => a.name.localeCompare(b.name));
  else filteredRepos.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

  currentPage = 1;
  renderRepos();
}

function renderRepos() {
  const container = document.getElementById('reposContainer');
  const pagContainer = document.getElementById('paginationContainer');
  if (!container) return;

  if (filteredRepos.length === 0) {
    container.innerHTML = `
      <div class="message-box">
        <div class="icon">📭</div>
        <h3>No Repositories Found</h3>
        <p>Try adjusting your filter or sort settings.</p>
      </div>`;
    if (pagContainer) pagContainer.innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PER_PAGE;
  const page = filteredRepos.slice(start, start + PER_PAGE);
  const totalPages = Math.ceil(filteredRepos.length / PER_PAGE);

  container.innerHTML = `<div class="repos-grid">
    ${page.map((r, i) => `
      <div class="repo-card" onclick='openModal(${JSON.stringify(r).replace(/'/g,"&#39;")})' style="animation-delay:${i*0.04}s">
        <div class="repo-name">📁 ${r.name}</div>
        <div class="repo-desc">${r.description || '<em style="color:var(--border)">No description</em>'}</div>
        <div class="repo-meta">
          ${r.language ? `<span class="meta-item"><span class="dot" style="background:${langColor(r.language)}"></span>${r.language}</span>` : ''}
          <span class="meta-item stars">★ ${fmt(r.stargazers_count)}</span>
          <span class="meta-item forks">⑂ ${fmt(r.forks_count)}</span>
        </div>
      </div>
    `).join('')}
  </div>`;

  // Pagination
  if (totalPages <= 1) { pagContainer.innerHTML = ''; return; }
  let pages = '';
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1)
      pages += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if (Math.abs(i - currentPage) === 2)
      pages += `<span style="color:var(--muted);padding:0 0.2rem;">…</span>`;
  }
  pagContainer.innerHTML = `
    <div class="pagination">
      <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Prev</button>
      ${pages}
      <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next →</button>
    </div>`;
}

function goPage(p) {
  currentPage = p;
  renderRepos();
  document.getElementById('reposContainer')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Modal ──
function openModal(repo) {
  document.getElementById('modalBody').innerHTML = `
    <h2>${repo.name}</h2>
    ${repo.fork ? `<div style="font-size:0.78rem;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:0.5rem;">⑂ Forked repository</div>` : ''}
    <div class="modal-desc">${repo.description || 'No description provided.'}</div>
    <div class="modal-stats">
      ${repo.language ? `<div class="modal-stat"><span style="width:8px;height:8px;border-radius:50%;background:${langColor(repo.language)};display:inline-block;"></span>${repo.language}</div>` : ''}
      <div class="modal-stat" style="color:var(--star)">★ ${fmt(repo.stargazers_count)} stars</div>
      <div class="modal-stat" style="color:var(--accent2)">⑂ ${fmt(repo.forks_count)} forks</div>
      <div class="modal-stat">👁 ${fmt(repo.watchers_count)} watchers</div>
      ${repo.open_issues_count ? `<div class="modal-stat">⚡ ${repo.open_issues_count} issues</div>` : ''}
      <div class="modal-stat">📅 ${new Date(repo.updated_at).toLocaleDateString()}</div>
    </div>
    <a class="modal-link" href="${repo.html_url}" target="_blank" rel="noopener">↗ Open on GitHub</a>
    ${repo.homepage ? `<a class="modal-link" href="${repo.homepage}" target="_blank" rel="noopener" style="background:var(--accent2);margin-left:0.5rem;">🌐 Live Demo</a>` : ''}
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.body.style.overflow = '';
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Helpers ──
function fmt(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return n ?? 0;
}

const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
  Java:'#b07219', 'C++':'#f34b7d', C:'#555555', Go:'#00ADD8',
  Rust:'#dea584', Ruby:'#701516', PHP:'#4F5D95', Swift:'#F05138',
  Kotlin:'#A97BFF', HTML:'#e34c26', CSS:'#563d7c', Shell:'#89e051',
  Dart:'#00B4AB', Vue:'#41b883', Svelte:'#ff3e00', Scala:'#c22d40',
};
function langColor(lang) { return LANG_COLORS[lang] || 'var(--accent)'; }

// ── Init ──
loadLastSearch();
</script>
